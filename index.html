<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <!-- To sprawia że strona dobrze wygląda na telefonie -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productivity Garden 🌱</title>

  <!-- Czcionki z Google Fonts: pixelowa do tytułów, okrągła do tekstu -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Biblioteka Supabase - daje nam dostęp do bazy danych -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== KOLORY I ZMIENNE ===== */
    :root {
      --green-dark:   #3d6b4f;
      --green-main:   #5a9e6f;
      --green-light:  #a8d5b5;
      --cream:        #f5f0e4;
      --cream-dark:   #e8e0cc;
      --brown:        #8b6f47;
      --brown-light:  #c4a882;
      --gold:         #e8b84b;
      --gold-dark:    #c99a2e;
      --text-dark:    #2d2416;
      --text-mid:     #5c4a2a;
      --text-light:   #8a7055;
      --red:          #c0392b;
      --shadow:       0 4px 0 rgba(0,0,0,0.15);
    }

    /* ===== RESET I PODSTAWY ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--green-dark);
      /* Kratka w tle jak ziemia w grze */
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      min-height: 100vh;
      color: var(--text-dark);
    }

    /* ===== EKRAN LOGOWANIA ===== */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 12px;
      box-shadow: var(--shadow), 0 8px 0 var(--brown);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .auth-card .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--green-dark);
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .auth-card .subtitle {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* Przełącznik logowanie/rejestracja */
    .auth-tabs {
      display: flex;
      border: 2px solid var(--brown-light);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: var(--cream-dark);
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-light);
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: var(--green-main);
      color: white;
    }

    /* ===== FORMULARZ ===== */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-mid);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--brown-light);
      border-radius: 8px;
      background: white;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--green-main);
    }

    /* ===== PRZYCISKI ===== */
    .btn {
      padding: 12px 24px;
      border: 2px solid transparent;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      width: 100%;
      background: var(--gold);
      border-color: var(--gold-dark);
      color: var(--text-dark);
      box-shadow: 0 4px 0 var(--gold-dark);
    }

    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 var(--gold-dark); }
    .btn-primary:active { transform: translateY(2px);  box-shadow: 0 2px 0 var(--gold-dark); }

    .btn-danger {
      background: var(--red);
      border-color: #922b21;
      color: white;
      box-shadow: 0 4px 0 #922b21;
      padding: 8px 16px;
      font-size: 13px;
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
    }

    .btn-green {
      background: var(--green-main);
      border-color: var(--green-dark);
      color: white;
      box-shadow: 0 4px 0 var(--green-dark);
    }

    .btn-green:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 var(--green-dark); }
    .btn-green:active { transform: translateY(2px);  box-shadow: 0 2px 0 var(--green-dark); }

    /* ===== KOMUNIKATY BŁĘDÓW ===== */
    .message {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .message.error   { background: #fde8e8; color: var(--red); border: 1px solid #f5c6c6; }
    .message.success { background: #e8f5e9; color: var(--green-dark); border: 1px solid #c6e6c6; }
    .message.show    { display: block; }

    /* ===== GŁÓWNA APLIKACJA ===== */
    #app-screen { display: none; min-height: 100vh; }

    /* Górny pasek */
    .topbar {
      background: var(--green-dark);
      border-bottom: 3px solid var(--brown);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--green-light);
      line-height: 1.6;
    }

    /* Monety w górnym pasku */
    .coins-display {
      background: var(--gold);
      border: 2px solid var(--gold-dark);
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-dark);
      box-shadow: 0 3px 0 var(--gold-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .btn-logout {
      background: none;
      border: 2px solid var(--brown-light);
      border-radius: 8px;
      color: var(--green-light);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
    }

    /* Zawartość aplikacji */
    .app-content {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* ===== SEKCJA ZADAŃ ===== */
    .section-card {
      background: var(--cream);
      border: 2px solid var(--brown-light);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .section-header {
      background: var(--cream-dark);
      border-bottom: 2px solid var(--brown-light);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--green-dark);
    }

    .section-body { padding: 20px; }

    /* Formularz dodawania zadania */
    .add-task-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .add-task-row input {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid var(--brown-light);
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      background: white;
      outline: none;
    }

    .add-task-row input:focus { border-color: var(--green-main); }

    /* Lista zadań */
    .task-list { list-style: none; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--cream-dark);
    }

    .task-item:last-child { border-bottom: none; }

    /* Custom checkbox - pixelowy styl */
    .task-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--brown-light);
      border-radius: 4px;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      transition: all 0.15s;
    }

    .task-checkbox.done {
      background: var(--green-main);
      border-color: var(--green-dark);
      color: white;
    }

    .task-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      transition: all 0.2s;
    }

    .task-title.done {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .task-reward {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-dark);
      white-space: nowrap;
    }

    .task-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-light);
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .task-delete:hover { color: var(--red); }

    /* Pusty stan */
    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: var(--text-light);
      font-size: 14px;
    }

    .empty-state .emoji { font-size: 36px; margin-bottom: 12px; }

    /* Loading spinner */
    .loading {
      text-align: center;
      padding: 24px;
      color: var(--text-light);
      font-size: 14px;
    }

    /* ===== ANIMACJA MONET ===== */
    @keyframes coin-pop {
      0%   { transform: translateY(0) scale(1);   opacity: 1; }
      100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
    }

    .coin-animation {
      position: fixed;
      font-weight: 700;
      font-size: 18px;
      color: var(--gold-dark);
      pointer-events: none;
      animation: coin-pop 1s ease-out forwards;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- ==================== EKRAN LOGOWANIA ==================== -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo">🌱 Productivity<br>Garden</div>
      <p class="subtitle">Twoja produktywna farma</p>

      <!-- Przełącznik logowanie / rejestracja -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Logowanie</button>
        <button class="auth-tab" onclick="switchTab('register')">Rejestracja</button>
      </div>

      <!-- Komunikat błędu/sukcesu -->
      <div id="auth-message" class="message"></div>

      <!-- Formularz -->
      <div class="form-group">
        <label for="auth-email">Adres e-mail</label>
        <input type="email" id="auth-email" placeholder="jan@example.com" />
      </div>
      <div class="form-group">
        <label for="auth-password">Hasło</label>
        <input type="password" id="auth-password" placeholder="minimum 6 znaków" />
      </div>

      <button class="btn btn-primary" onclick="handleAuth()">
        <span id="auth-btn-text">Zaloguj się</span>
      </button>
    </div>
  </div>

  <!-- ==================== GŁÓWNA APLIKACJA ==================== -->
  <div id="app-screen">

    <!-- Górny pasek -->
    <div class="topbar">
      <div class="topbar-logo">🌱 P.Garden</div>
      <div class="topbar-right">
        <div class="coins-display">
          🪙 <span id="coins-count">0</span>
        </div>
        <button class="btn-logout" onclick="logout()">Wyloguj</button>
      </div>
    </div>

    <!-- Zawartość -->
    <div class="app-content">

      <!-- SEKCJA: ZADANIA -->
      <div class="section-card">
        <div class="section-header">
          <span class="section-title">📋 To-Do Lista</span>
          <span style="font-size:12px; color:var(--text-light);">+10 🪙 za zadanie</span>
        </div>
        <div class="section-body">

          <!-- Dodawanie nowego zadania -->
          <div class="add-task-row">
            <input
              type="text"
              id="new-task-input"
              placeholder="Wpisz nowe zadanie..."
              onkeydown="if(event.key==='Enter') addTask()"
            />
            <button class="btn btn-green btn-small" onclick="addTask()">Dodaj</button>
          </div>

          <!-- Lista zadań będzie tu wstrzykiwana przez JavaScript -->
          <div id="tasks-container">
            <div class="loading">Ładowanie zadań...</div>
          </div>

        </div>
      </div>

      <!-- PLACEHOLDER na przyszłe sekcje -->
      <div class="section-card">
        <div class="section-header">
          <span class="section-title">🔁 Nawyki</span>
        </div>
        <div class="section-body">
          <div class="empty-state">
            <div class="emoji">🚧</div>
            <p>Nawyki pojawią się w następnym kroku!</p>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-header">
          <span class="section-title">🎯 Cele</span>
        </div>
        <div class="section-body">
          <div class="empty-state">
            <div class="emoji">🚧</div>
            <p>Cele pojawią się w następnym kroku!</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ==================== KONFIGURACJA SUPABASE ====================
    // To są Twoje klucze - łączą aplikację z bazą danych
    const SUPABASE_URL = 'https://nndonweuhrlinoakunyn.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uZG9ud2V1aHJsaW5vYWt1bnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4ODI0NTYsImV4cCI6MjA5ODQ1ODQ1Nn0.E04xL9bbtABVFkfO0SuSle0VeFqbe9j7ZHi7RkdOLng'

    // Tworzymy "klienta" Supabase - obiekt przez który rozmawiamy z bazą
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // Zmienna przechowująca aktualnie zalogowanego usera
    let currentUser = null

    // ==================== LOGOWANIE / REJESTRACJA ====================

    // Przełączanie zakładek Logowanie/Rejestracja
    let currentTab = 'login'

    function switchTab(tab) {
      currentTab = tab
      // Aktualizuj wygląd zakładek
      document.querySelectorAll('.auth-tab').forEach((el, i) => {
        el.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'))
      })
      // Zmień tekst przycisku
      document.getElementById('auth-btn-text').textContent =
        tab === 'login' ? 'Zaloguj się' : 'Zarejestruj się'
      hideMessage()
    }

    // Obsługa formularza logowania/rejestracji
    async function handleAuth() {
      const email    = document.getElementById('auth-email').value.trim()
      const password = document.getElementById('auth-password').value

      if (!email || !password) {
        showMessage('Wypełnij oba pola!', 'error')
        return
      }

      if (currentTab === 'login') {
        // === LOGOWANIE ===
        const { data, error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) {
          showMessage('Błąd logowania: ' + translateError(error.message), 'error')
        }
        // Jeśli sukces, onAuthStateChange poniżej obsłuży resztę automatycznie

      } else {
        // === REJESTRACJA ===
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) {
          showMessage('Błąd rejestracji: ' + translateError(error.message), 'error')
        } else {
          showMessage('Konto założone! Sprawdź e-mail aby potwierdzić, lub zaloguj się od razu.', 'success')
        }
      }
    }

    // Tłumaczenie angielskich błędów Supabase na polski
    function translateError(msg) {
      if (msg.includes('Invalid login'))    return 'Nieprawidłowy e-mail lub hasło.'
      if (msg.includes('already registered')) return 'Ten e-mail jest już zarejestrowany.'
      if (msg.includes('Password should'))  return 'Hasło musi mieć co najmniej 6 znaków.'
      return msg
    }

    // Wylogowanie
    async function logout() {
      await supabase.auth.signOut()
    }

    // Pokaż/ukryj komunikaty pod formularzem
    function showMessage(text, type) {
      const el = document.getElementById('auth-message')
      el.textContent = text
      el.className = `message ${type} show`
    }

    function hideMessage() {
      document.getElementById('auth-message').className = 'message'
    }

    // ==================== NASŁUCHIWANIE NA ZMIANY SESJI ====================
    // Ta funkcja odpala się automatycznie gdy user się loguje lub wylogowuje
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session) {
        // User zalogowany - pokaż aplikację
        currentUser = session.user
        showApp()
      } else {
        // User wylogowany - pokaż ekran logowania
        currentUser = null
        showAuthScreen()
      }
    })

    // Pokaż główną aplikację
    async function showApp() {
      document.getElementById('auth-screen').style.display = 'none'
      document.getElementById('app-screen').style.display  = 'block'
      await loadCoins()
      await loadTasks()
    }

    // Pokaż ekran logowania
    function showAuthScreen() {
      document.getElementById('auth-screen').style.display = 'flex'
      document.getElementById('app-screen').style.display  = 'none'
    }

    // ==================== MONETY ====================

    async function loadCoins() {
      // Pobierz profil usera z bazy (tam są monety)
      const { data, error } = await supabase
        .from('profiles')
        .select('coins')
        .eq('id', currentUser.id)  // tylko wiersz tego usera
        .single()                  // oczekujemy jednego wiersza

      if (data) {
        updateCoinsDisplay(data.coins)
      } else {
        // Profil nie istnieje - utwórz go przy pierwszym logowaniu
        await supabase.from('profiles').insert({ id: currentUser.id, coins: 0 })
        updateCoinsDisplay(0)
      }
    }

    function updateCoinsDisplay(amount) {
      document.getElementById('coins-count').textContent = amount
    }

    // Dodaj monety do profilu usera
    async function addCoins(amount, clickEvent) {
      // Pobierz aktualne monety
      const { data } = await supabase
        .from('profiles')
        .select('coins')
        .eq('id', currentUser.id)
        .single()

      const newCoins = (data?.coins || 0) + amount

      // Zapisz nową liczbę
      await supabase
        .from('profiles')
        .update({ coins: newCoins })
        .eq('id', currentUser.id)

      updateCoinsDisplay(newCoins)

      // Animacja monet (latający tekst +10🪙)
      if (clickEvent) spawnCoinAnimation(clickEvent, amount)
    }

    // Animacja monet - pojawia się przy kliknięciu checkboxa
    function spawnCoinAnimation(event, amount) {
      const el = document.createElement('div')
      el.className = 'coin-animation'
      el.textContent = `+${amount} 🪙`
      el.style.left = (event.clientX - 20) + 'px'
      el.style.top  = (event.clientY - 10) + 'px'
      document.body.appendChild(el)
      setTimeout(() => el.remove(), 1000)
    }

    // ==================== ZADANIA ====================

    async function loadTasks() {
      const container = document.getElementById('tasks-container')
      container.innerHTML = '<div class="loading">Ładowanie...</div>'

      // Pobierz wszystkie zadania tego usera, najnowsze na górze
      const { data: tasks, error } = await supabase
        .from('tasks')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })

      if (error) {
        container.innerHTML = '<div class="empty-state">Błąd ładowania zadań.</div>'
        return
      }

      renderTasks(tasks)
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container')

      if (!tasks || tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="emoji">✏️</div>
            <p>Brak zadań. Dodaj pierwsze zadanie powyżej!</p>
          </div>`
        return
      }

      // Budujemy HTML listy zadań
      const html = `<ul class="task-list">` +
        tasks.map(task => `
          <li class="task-item" id="task-${task.id}">
            <div
              class="task-checkbox ${task.is_done ? 'done' : ''}"
              onclick="toggleTask('${task.id}', ${task.is_done}, ${task.coin_reward}, event)"
            >
              ${task.is_done ? '✓' : ''}
            </div>
            <span class="task-title ${task.is_done ? 'done' : ''}">${escapeHtml(task.title)}</span>
            <span class="task-reward">+${task.coin_reward} 🪙</span>
            <button class="task-delete" onclick="deleteTask('${task.id}')" title="Usuń">✕</button>
          </li>`
        ).join('') +
      `</ul>`

      container.innerHTML = html
    }

    // Dodaj nowe zadanie
    async function addTask() {
      const input = document.getElementById('new-task-input')
      const title = input.value.trim()
      if (!title) return

      input.value = '' // wyczyść pole

      const { error } = await supabase.from('tasks').insert({
        user_id:     currentUser.id,
        title:       title,
        coin_reward: 10,    // domyślna nagroda za zadanie
        is_done:     false
      })

      if (!error) await loadTasks() // odśwież listę
    }

    // Odhacz / cofnij zadanie
    async function toggleTask(taskId, isDone, coinReward, event) {
      const newDone = !isDone

      const { error } = await supabase
        .from('tasks')
        .update({
          is_done:      newDone,
          completed_at: newDone ? new Date().toISOString() : null
        })
        .eq('id', taskId)

      if (!error) {
        if (newDone) {
          // Zadanie ukończone - daj monety!
          await addCoins(coinReward, event)
        } else {
          // Cofnięto - odbierz monety
          await addCoins(-coinReward, null)
        }
        await loadTasks()
      }
    }

    // Usuń zadanie
    async function deleteTask(taskId) {
      const { error } = await supabase
        .from('tasks')
        .delete()
        .eq('id', taskId)

      if (!error) await loadTasks()
    }

    // Zabezpieczenie przed XSS - zamiana znaków specjalnych w tytułach zadań
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }
  </script>
</body>
