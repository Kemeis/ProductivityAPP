<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17191d"><title>Task Garden — Tasks</title>
<style>
:root{--bg:#111315;--panel:#191c20;--panel2:#20242a;--border:#30353d;--text:#e7e9ec;--muted:#969da8;--accent:#9b86e8;--danger:#e47b86;--input:#14171a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:30px;box-shadow:0 20px 60px #0007}
.brand{font-size:22px;font-weight:700}.subtitle{color:var(--muted);margin:4px 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#121417;border:1px solid var(--border);border-radius:9px;padding:3px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:8px;border-radius:7px;color:var(--muted)}.tabs button.active{background:var(--panel2);color:var(--text)}
label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}input,textarea{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;padding:10px 11px;outline:none}input:focus,textarea:focus{border-color:#62578a}
.primary,.ghost,.danger{border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--panel2)}.primary{background:var(--accent);border-color:var(--accent);font-weight:650}.danger{color:var(--danger)}.form-message{min-height:20px;margin-top:12px;color:var(--danger)}.form-message.success{color:#82d39a}
.app{height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr);overflow:hidden}.sidebar{background:#15171a;border-right:1px solid var(--border);display:flex;flex-direction:column}.sidebar-head{padding:18px;border-bottom:1px solid var(--border)}.brand-small{font-size:17px;font-weight:700}.user-line{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-actions{padding:12px;display:grid;gap:7px}.side-actions button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px}.side-actions button:hover{background:var(--panel2);border-color:var(--border)}
.tree{overflow:auto;padding:6px 10px 20px}.tree-row{display:flex;align-items:center;gap:6px;min-height:34px;border-radius:7px;padding:4px 7px}.tree-row:hover{background:var(--panel2)}.tree-row.selected{background:#2a2638}.tree-toggle{width:20px;border:0;background:transparent;color:var(--muted);padding:0}.tree-icon{color:#aeb5bf;width:17px}.tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tree-children{margin-left:17px}.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:grid;gap:7px}.coins{color:#c5b5ff}
.main{min-width:0;display:flex;flex-direction:column;background:#111315}.topbar{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:15px}.crumbs{color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.crumbs strong{color:var(--text)}.content{overflow:auto;padding:30px;max-width:1100px;width:100%;margin:auto}.welcome{padding:8px 0 25px}.welcome h1{font-size:28px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.folder-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:15px;text-align:left;min-height:90px}.folder-card:hover{border-color:#505762;background:#1c2025}.folder-card .count{color:var(--muted);font-size:12px;margin-top:8px}
.list-view{display:grid;gap:18px}.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}.section-head{padding:15px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-weight:650}.section-body{padding:12px}.task{display:grid;grid-template-columns:22px 1fr auto auto;gap:9px;align-items:center;padding:9px 7px;border-radius:7px}.task:hover{background:var(--panel2)}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}.reward{color:#bca8ff;font-size:12px}.task-delete{border:0;background:transparent;color:var(--muted);font-size:18px}.task-delete:hover{color:var(--danger)}.add-row{display:flex;gap:8px;margin-top:10px}.add-row input{flex:1}
.note-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}.note-head{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px}.note-head input{font-weight:650;background:transparent}.editor{min-height:430px;padding:18px;outline:none}.editor:empty:before{content:attr(data-placeholder);color:#6e757f}.toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px;border-bottom:1px solid var(--border);background:#17191d}.tool{border:1px solid var(--border);background:#20242a;border-radius:6px;min-width:32px;height:30px}.tool:hover{background:#292e35}.save-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}.modal h2{font-size:18px;margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:20px 15px}.topbar{padding:0 15px}}
</style></head>
<body>
<div id="auth" class="auth"><div class="auth-card">
<div class="brand">Task Garden</div><div class="subtitle">Tasks and notes</div>
<div class="tabs"><button id="loginTab" class="active">Log in</button><button id="registerTab">Create account</button></div>
<form id="authForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required>
<div id="confirmWrap" class="hidden"><label>Confirm password</label><input id="confirm" type="password"></div>
<button class="primary" style="width:100%;margin-top:18px" id="authSubmit">Log in</button><div id="authMsg" class="form-message"></div></form>
</div></div>
<div id="app" class="app hidden"><aside class="sidebar">
<div class="sidebar-head"><div class="brand-small">Task Garden</div><div id="userLine" class="user-line"></div></div>
<div class="side-actions"><button id="newFolderBtn">＋ New folder</button><button id="newNoteBtn">＋ Add note</button><button id="newListBtn">＋ Add tasklist</button></div>
<div id="tree" class="tree"></div><div class="sidebar-foot"><div class="coins">Coins: <strong id="coins">0</strong></div><button class="ghost" id="gardenBtn">Go to Garden</button><button class="ghost" id="logoutBtn">Log out</button></div>
</aside><main class="main"><header class="topbar"><div id="crumbs" class="crumbs"><strong>My workspace</strong></div><button class="ghost" id="upBtn">Up</button></header><section id="content" class="content"></section></main></div>
<div id="modalBack" class="modal-back hidden"><div class="modal"><h2 id="modalTitle"></h2><input id="modalInput" placeholder="Name"><div class="modal-actions"><button class="ghost" id="modalCancel">Cancel</button><button class="primary" id="modalOk">Create</button></div></div></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const db=createClient("https://nndonweuhrlinoakunyn.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uZG9ud2V1aHJsaW5vYWt1bnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4ODI0NTYsImV4cCI6MjA5ODQ1ODQ1Nn0.E04xL9bbtABVFkfO0SuSle0VeFqbe9j7ZHi7RkdOLng");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let user=null,folders=[],lists=[],notes=[],tasks=[],profile={coins:0},currentFolder=null,currentDoc=null,authMode="login",modalAction=null;
function msg(t,ok=false){$("#authMsg").textContent=t;$("#authMsg").className="form-message"+(ok?" success":"")}
function setAuthMode(m){authMode=m;$("#loginTab").classList.toggle("active",m==="login");$("#registerTab").classList.toggle("active",m==="register");$("#confirmWrap").classList.toggle("hidden",m!=="register");$("#authSubmit").textContent=m==="login"?"Log in":"Create account"}
$("#loginTab").onclick=()=>setAuthMode("login");$("#registerTab").onclick=()=>setAuthMode("register");
$("#authForm").onsubmit=async e=>{e.preventDefault();msg("");let email=$("#email").value.trim(),password=$("#password").value;if(authMode==="register"&&password!==$("#confirm").value)return msg("Passwords do not match.");try{let r=authMode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(r.error)throw r.error;if(authMode==="register"&&!r.data.session){setAuthMode("login");msg("Account created. Check your email to confirm it.",true)}}catch(e){msg(e.message||"Authentication failed.")}};
$("#logoutBtn").onclick=()=>db.auth.signOut();$("#gardenBtn").onclick=()=>location.href="garden.html";
async function load(){let uid=user.id;let [f,l,n,t,p]=await Promise.all([db.from("folders").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("task_lists").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("notes").select("*").eq("user_id",uid).order("updated_at",{ascending:false}),db.from("tasks").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("profiles").select("coins").eq("id",uid).maybeSingle()]);for(let r of [f,l,n,t,p])if(r.error)throw r.error;folders=f.data||[];lists=l.data||[];notes=n.data||[];tasks=t.data||[];profile=p.data||{coins:0};$("#coins").textContent=profile.coins??0;$("#userLine").textContent=user.email;renderTree();renderHome()}
function childrenOf(p){return folders.filter(f=>(f.parent_id||null)===(p||null))}
function depth(id){let d=0,f=folders.find(x=>x.id===id);while(f?.parent_id&&d<10){d++;f=folders.find(x=>x.id===f.parent_id)}return d}
function path(id){let a=[],f=folders.find(x=>x.id===id);while(f){a.unshift(f);f=folders.find(x=>x.id===f.parent_id)}return a}
function renderTree(){let el=$("#tree");el.innerHTML="";function draw(parent,wrap){for(let f of childrenOf(parent)){let row=document.createElement("div");row.className="tree-row"+(currentFolder===f.id?" selected":"");row.innerHTML=`<button class="tree-toggle">${childrenOf(f.id).length?"▾":""}</button><span class="tree-icon">▱</span><span class="tree-name">${esc(f.name)}</span>`;row.onclick=()=>openFolder(f.id);wrap.append(row);if(childrenOf(f.id).length){let sub=document.createElement("div");sub.className="tree-children";wrap.append(sub);draw(f.id,sub)}}}draw(null,el);for(let l of lists.filter(x=>!x.folder_id)){let row=document.createElement("div");row.className="tree-row";row.innerHTML=`<span class="tree-icon">☷</span><span class="tree-name">${esc(l.name)}</span>`;row.onclick=()=>openList(l.id);el.append(row)}}
function folderItems(id){return{folders:childrenOf(id),lists:lists.filter(l=>(l.folder_id||null)===id),notes:notes.filter(n=>(n.folder_id||null)===id)}}
function renderHome(){currentFolder=null;currentDoc=null;$("#crumbs").innerHTML="<strong>My workspace</strong>";$("#content").innerHTML=`<div class="welcome"><h1>My workspace</h1><p>Your folders, notes and task lists.</p></div><div class="folder-grid">${childrenOf(null).map(f=>`<button class="folder-card" data-f="${f.id}"><strong>▱ ${esc(f.name)}</strong><div class="count">${folderItems(f.id).lists.length} task lists · ${folderItems(f.id).notes.length} notes</div></button>`).join("")}</div>${childrenOf(null).length?"":"<div class='empty'>Create a folder, note or task list to get started.</div>"}`;document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openFolder(b.dataset.f))}
function taskHTML(t){return`<div class="task ${t.is_done?"done":""}"><input type="checkbox" data-check="${t.id}" ${t.is_done?"checked":""}><span class="task-title">${esc(t.title)}</span><span class="reward">+${Number(t.coin_reward||5)}</span><button class="task-delete" data-del="${t.id}">×</button></div>`}
function listHTML(l){let ts=tasks.filter(t=>t.list_id===l.id);return`<div class="section"><div class="section-head"><span class="section-title">☷ ${esc(l.name)}</span><button class="ghost" data-open-list="${l.id}">Open</button></div><div class="section-body">${ts.slice(0,8).map(taskHTML).join("")||"<div style='color:var(--muted)'>No tasks yet.</div>"}<div class="add-row"><input data-add="${l.id}" placeholder="Add task…"><button class="primary" data-addbtn="${l.id}">Add</button></div></div>`}
function noteHTML(n){return`<div class="section"><div class="section-head"><span class="section-title">□ ${esc(n.title)}</span><button class="ghost" data-open-note="${n.id}">Open</button></div><div class="section-body" style="color:var(--muted);max-height:90px;overflow:hidden">${n.content_html||"<em>Empty note</em>"}</div></div>`}
function renderFolder(id){currentFolder=id;currentDoc=null;let f=folders.find(x=>x.id===id),it=folderItems(id);$("#crumbs").textContent=path(id).map(x=>x.name).join(" / ");$("#content").innerHTML=`<div class="welcome"><h1>${esc(f.name)}</h1><p>${it.folders.length} folders · ${it.lists.length} task lists · ${it.notes.length} notes</p></div><div class="folder-grid">${it.folders.map(x=>`<button class="folder-card" data-f="${x.id}"><strong>▱ ${esc(x.name)}</strong></button>`).join("")}</div><div class="list-view" style="margin-top:18px">${it.lists.map(listHTML).join("")}${it.notes.map(noteHTML).join("")}</div>`;document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openFolder(b.dataset.f));bind()}
function bind(){document.querySelectorAll("[data-open-list]").forEach(b=>b.onclick=()=>openList(b.dataset.openList));document.querySelectorAll("[data-open-note]").forEach(b=>b.onclick=()=>openNote(b.dataset.openNote));document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>toggleTask(c.dataset.check,c.checked));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteTask(b.dataset.del));document.querySelectorAll("[data-addbtn]").forEach(b=>b.onclick=()=>addTask(b.dataset.addbtn));document.querySelectorAll("[data-add]").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")addTask(i.dataset.add)})}
async function addTask(id){let i=document.querySelector(`[data-add="${id}"]`),title=i?.value.trim();if(!title)return;let r=await db.from("tasks").insert({user_id:user.id,list_id:id,title,coin_reward:5,is_done:false,sort_order:Date.now()});if(r.error)return alert(r.error.message);await load()}
async function toggleTask(id,done){let t=tasks.find(x=>x.id===id);let r=await db.from("tasks").update({is_done:done}).eq("id",id).eq("user_id",user.id);if(r.error)return alert(r.error.message);if(done){let next=Number(profile.coins||0)+Number(t?.coin_reward||5);await db.from("profiles").update({coins:next}).eq("id",user.id)}await load()}
async function deleteTask(id){if(!confirm("Delete this task?"))return;let r=await db.from("tasks").delete().eq("id",id).eq("user_id",user.id);if(r.error)alert(r.error.message);else load()}
function openFolder(id){renderFolder(id);renderTree()}
function openList(id){currentDoc={type:"list",id};let l=lists.find(x=>x.id===id);currentFolder=l?.folder_id||null;$("#crumbs").textContent=[...path(currentFolder).map(x=>x.name),l.name].filter(Boolean).join(" / ");$("#content").innerHTML=`<div class="list-view"><div class="section"><div class="section-head"><span class="section-title">☷ ${esc(l.name)}</span><span style="color:var(--muted)">${tasks.filter(t=>t.list_id===id&&t.is_done).length}/${tasks.filter(t=>t.list_id===id).length}</span></div><div class="section-body">${tasks.filter(t=>t.list_id===id).map(taskHTML).join("")||"<div style='color:var(--muted)'>No tasks yet.</div>"}<div class="add-row"><input data-add="${id}" placeholder="Add task…"><button class="primary" data-addbtn="${id}">Add</button></div></div></div>`;bind()}
function openNote(id){currentDoc={type:"note",id};let n=notes.find(x=>x.id===id);currentFolder=n?.folder_id||null;$("#crumbs").textContent=[...path(currentFolder).map(x=>x.name),n.title].filter(Boolean).join(" / ");$("#content").innerHTML=`<div class="note-card"><div class="note-head"><input id="noteTitle" value="${esc(n.title)}"><button class="primary" id="saveNote">Save</button></div><div class="toolbar"><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="formatBlock" data-val="h2">H</button><button class="tool" data-cmd="insertUnorderedList">• List</button><button class="tool" data-cmd="insertOrderedList">1. List</button><button class="tool" data-cmd="insertHorizontalRule">―</button><button class="tool" data-cmd="undo">↶</button><button class="tool" data-cmd="redo">↷</button></div><div id="editor" class="editor" contenteditable="true" data-placeholder="Start writing…">${n.content_html||""}</div><div class="save-row"><span>Notes are saved to your account.</span><button class="danger" id="deleteNote">Delete note</button></div></div>`;document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.val||null);$("#editor").focus()});$("#saveNote").onclick=saveNote;$("#deleteNote").onclick=deleteNote}
async function saveNote(){let n=notes.find(x=>x.id===currentDoc.id),r=await db.from("notes").update({title:$("#noteTitle").value.trim()||"Untitled note",content_html:$("#editor").innerHTML,updated_at:new Date().toISOString()}).eq("id",n.id).eq("user_id",user.id);if(r.error)return alert(r.error.message);await load();openNote(n.id)}
async function deleteNote(){if(!confirm("Delete this note?"))return;let r=await db.from("notes").delete().eq("id",currentDoc.id).eq("user_id",user.id);if(r.error)alert(r.error.message);else load()}
function modal(title,action){modalAction=action;$("#modalTitle").textContent=title;$("#modalInput").value="";$("#modalBack").classList.remove("hidden");setTimeout(()=>$("#modalInput").focus(),20)}
$("#modalCancel").onclick=()=>$("#modalBack").classList.add("hidden");$("#modalOk").onclick=()=>modalAction?.($("#modalInput").value.trim());$("#modalInput").onkeydown=e=>{if(e.key==="Enter")$("#modalOk").click()}
async function newFolder(){let parent=currentFolder||null;if(depth(parent)>=5)return alert("Maximum folder depth is 5.");modal("New folder",async name=>{if(!name)return;let r=await db.from("folders").insert({user_id:user.id,name,parent_id:parent,sort_order:Date.now()});if(r.error)alert(r.error.message);else{$("#modalBack").classList.add("hidden");await load();if(parent)openFolder(parent)}})}
async function newList(){let folder=currentFolder||null;modal("New task list",async name=>{if(!name)return;let r=await db.from("task_lists").insert({user_id:user.id,name,folder_id:folder,sort_order:Date.now()});if(r.error)alert(r.error.message);else{$("#modalBack").classList.add("hidden");await load();if(folder)openFolder(folder)}})}
async function newNote(){let folder=currentFolder||null;modal("New note",async name=>{if(!name)return;let r=await db.from("notes").insert({user_id:user.id,title:name,folder_id:folder,content_html:"",updated_at:new Date().toISOString()}).select().single();if(r.error)alert(r.error.message);else{$("#modalBack").classList.add("hidden");await load();openNote(r.data.id)}})}
$("#newFolderBtn").onclick=newFolder;$("#newListBtn").onclick=newList;$("#newNoteBtn").onclick=newNote;$("#upBtn").onclick=()=>{if(currentFolder){let f=folders.find(x=>x.id===currentFolder);f?.parent_id?openFolder(f.parent_id):renderHome()}else renderHome()};
db.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user){$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");try{await load()}catch(e){alert(e.message)}}else{$("#app").classList.add("hidden");$("#auth").classList.remove("hidden")}});
let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");await load()}else renderHome();
</script></body></html>
