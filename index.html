<body>
<div id="auth" class="auth"><div class="auth-card">
<div class="brand">Task Garden</div><div class="subtitle">Tasks and notes</div>
<div class="tabs"><button id="loginTab" class="active">Log in</button><button id="registerTab">Create account</button></div>
<form id="authForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required>
<div id="confirmWrap" class="hidden"><label>Confirm password</label><input id="confirm" type="password"></div>
<button class="primary" style="width:100%;margin-top:18px" id="authSubmit">Log in</button><div id="authMsg" class="form-message"></div></form>
</div></div>
<div id="app" class="app hidden"><div id="mobileShade" class="mobile-shade hidden"></div><aside class="sidebar" id="sidebar">
<div class="sidebar-head"><button id="mobileCloseBtn" class="ghost mobile-close" aria-label="Close navigation">✕</button><div class="brand-small">Task Garden</div><div id="userLine" class="user-line"></div></div>
<div class="side-actions"><button id="newFolderBtn">＋ New folder</button><button id="newNoteBtn">＋ Add note</button><button id="newListBtn">＋ Add tasklist</button></div>
<div id="tree" class="tree"></div><div class="sidebar-foot"><div class="coins">Coins: <strong id="coins">0</strong></div><button class="ghost" id="gardenBtn">Go to Garden</button><button class="ghost" id="optionsBtn">Options</button><button class="ghost" id="logoutBtn">Log out</button></div>
</aside><main class="main"><header class="topbar"><button class="ghost mobile-nav" id="mobileNavBtn" aria-label="Open navigation" aria-expanded="false">☰</button><div id="crumbs" class="crumbs"><strong>My workspace</strong></div><button class="ghost" id="upBtn">Up</button></header><section id="content" class="content"></section></main></div>
<div id="modalBack" class="modal-back hidden"><div class="modal">
<h2 id="modalTitle"></h2>
<div id="modalBody"></div>
<input id="modalInput" placeholder="Name">
<div class="modal-actions"><button class="ghost" id="modalCancel">Cancel</button><button class="primary" id="modalOk">Create</button></div>
</div></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const db=createClient("https://nndonweuhrlinoakunyn.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uZG9ud2V1aHJsaW5vYWt1bnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4ODI0NTYsImV4cCI6MjA5ODQ1ODQ1Nn0.E04xL9bbtABVFkfO0SuSle0VeFqbe9j7ZHi7RkdOLng");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let user=null,folders=[],lists=[],notes=[],tasks=[],profile={coins:0},currentFolder=null,currentDoc=null,authMode="login",modalAction=null;
const expandedFolders=new Set();
let modalBusy=false;
function msg(t,ok=false){$("#authMsg").textContent=t;$("#authMsg").className="form-message"+(ok?" success":"")}
function setAuthMode(m){authMode=m;$("#loginTab").classList.toggle("active",m==="login");$("#registerTab").classList.toggle("active",m==="register");$("#confirmWrap").classList.toggle("hidden",m!=="register");$("#authSubmit").textContent=m==="login"?"Log in":"Create account"}
$("#loginTab").onclick=()=>setAuthMode("login");$("#registerTab").onclick=()=>setAuthMode("register");
$("#authForm").onsubmit=async e=>{e.preventDefault();msg("");let email=$("#email").value.trim(),password=$("#password").value;if(authMode==="register"&&password!==$("#confirm").value)return msg("Passwords do not match.");try{let r=authMode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(r.error)throw r.error;if(authMode==="register"&&!r.data.session){setAuthMode("login");msg("Account created. Check your email to confirm it.",true)}}catch(e){msg(e.message||"Authentication failed.")}};
$("#gardenBtn").onclick=()=>location.href="garden.html";
$("#logoutBtn").onclick=()=>db.auth.signOut();
async function load(){let uid=user.id;let [f,l,n,t,p]=await Promise.all([db.from("folders").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("task_lists").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("notes").select("*").eq("user_id",uid).order("updated_at",{ascending:false}),db.from("tasks").select("*").eq("user_id",uid).order("sort_order").order("created_at"),db.from("profiles").select("coins").eq("id",uid).maybeSingle()]);for(let r of [f,l,n,t,p])if(r.error)throw r.error;folders=f.data||[];lists=l.data||[];notes=n.data||[];tasks=t.data||[];profile=p.data||{coins:0};$("#coins").textContent=profile.coins??0;$("#userLine").textContent=user.email;renderTree();renderHome()}
function childrenOf(p){return folders.filter(f=>(f.parent_id||null)===(p||null))}
function depth(id){let d=0,f=folders.find(x=>x.id===id);while(f?.parent_id&&d<10){d++;f=folders.find(x=>x.id===f.parent_id)}return d}
function path(id){let a=[],f=folders.find(x=>x.id===id);while(f){a.unshift(f);f=folders.find(x=>x.id===f.parent_id)}return a}
function renderTree(){
  const el=$("#tree");
  el.innerHTML="";
  

  const makeMenu=(type,id)=>`<div class="tree-menu" data-tree-menu-box="${type}:${id}">
    <button data-tree-action="open">Open</button>
    <button data-tree-action="rename">Rename</button>
    <button data-tree-action="color">Change color</button>
    <button data-tree-action="delete">Delete</button>
    <button class="mobile-move" data-tree-action="move">Move to…</button>
  </div>`;

  function makeRow(item,type,depthLevel=0){
    const row=document.createElement("div");
    row.className="tree-row"+((type==="folder"&&currentFolder===item.id)?" selected":"");
    row.draggable=true;
    row.dataset.dragType=type;
    row.dataset.dragId=item.id;
    row.style.borderLeftColor=item.color||"transparent";

    if(type==="folder"){
      const hasChildren=childrenOf(item.id).length || lists.some(x=>(x.folder_id||null)===item.id) || notes.some(x=>(x.folder_id||null)===item.id);
      row.innerHTML=`<button class="tree-toggle" title="${hasChildren?"Expand/collapse":"No contents"}">${hasChildren?(expandedFolders.has(item.id)?"▾":"▸"):""}</button>
        <span class="tree-icon">▱</span><span class="tree-name">${esc(item.name)}</span>
        <button class="tree-more" title="Options">⋯</button>${makeMenu(type,item.id)}`;

      row.querySelector(".tree-toggle").onclick=e=>{
        e.stopPropagation();
        if(!hasChildren)return;
        expandedFolders.has(item.id)?expandedFolders.delete(item.id):expandedFolders.add(item.id);
        renderTree();
      };
      row.onclick=e=>{
        if(e.target.closest(".tree-more,.tree-menu,.tree-toggle"))return;
        openFolder(item.id);
      };
    }else{
      row.innerHTML=`<span class="tree-icon">${type==="note"?"□":"☷"}</span><span class="tree-name">${esc(type==="note"?item.title:item.name)}</span>
        <button class="tree-more" title="Options">⋯</button>${makeMenu(type,item.id)}`;
      row.onclick=e=>{
        if(e.target.closest(".tree-more,.tree-menu"))return;
        type==="note"?openNote(item.id):openList(item.id);
      };
    }

    row.addEventListener("dragstart",e=>{
      e.stopPropagation();
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",JSON.stringify({type,id:item.id}));
      row.classList.add("dragging");
    });
    row.addEventListener("dragend",()=>row.classList.remove("dragging"));

    row.addEventListener("dragover",e=>{
      if(type!=="folder")return;
      e.preventDefault();e.stopPropagation();
      row.classList.add("drop-target");
    });
    row.addEventListener("dragleave",()=>row.classList.remove("drop-target"));
    row.addEventListener("drop",async e=>{
      if(type!=="folder")return;
      e.preventDefault();e.stopPropagation();row.classList.remove("drop-target");
      let d;try{d=JSON.parse(e.dataTransfer.getData("text/plain"))}catch{return}
      if(d.type==="folder"){
        if(d.id===item.id || path(item.id).some(x=>x.id===d.id))return alert("You cannot move a folder into itself or one of its subfolders.");
        if(depth(item.id)+1>5)return alert("That would exceed the 5-level folder limit.");
      }
      const table=d.type==="folder"?"folders":d.type==="note"?"notes":"task_lists";
      const patch=d.type==="folder"?{parent_id:item.id}:{folder_id:item.id};
      const r=await db.from(table).update(patch).eq("id",d.id).eq("user_id",user.id);
      if(r.error)alert(r.error.message);else{expandedFolders.add(item.id);await refreshView()}
    });

    const more=row.querySelector(".tree-more");
    more.onclick=e=>{
      e.stopPropagation();
      document.querySelectorAll(".sidebar .tree-menu.open").forEach(x=>x.classList.remove("open"));

$("#optionsBtn").onclick=()=>{
 resetModal();$("#modalTitle").textContent="Options";$("#modalInput").classList.add("hidden");$("#modalOk").classList.add("hidden");
 $("#modalBody").innerHTML=`<div class="settings-list"><button id="settingsHome">⌂ My workspace</button><button id="settingsExpand">Expand all folders</button><button id="settingsCollapse">Collapse all folders</button><button id="settingsGarden">Go to Garden</button></div><div class="settings-note">Your content is stored in your Supabase account.</div>`;
 $("#modalBack").classList.remove("hidden");
 $("#settingsHome").onclick=()=>{closeModal();renderHome();closeMobileNav()};
 $("#settingsExpand").onclick=()=>{folders.forEach(f=>expandedFolders.add(f.id));renderTree();closeModal()};
 $("#settingsCollapse").onclick=()=>{expandedFolders.clear();renderTree();closeModal()};
 $("#settingsGarden").onclick=()=>location.href="garden.html";
};

$("#newFolderBtn").onclick=()=>{closeMobileNav();newFolder()};$("#newListBtn").onclick=()=>{closeMobileNav();newList()};$("#newNoteBtn").onclick=()=>{closeMobileNav();newNote()};$("#upBtn").onclick=()=>{if(currentDoc){currentDoc=null;if(currentFolder)openFolder(currentFolder);else renderHome()}else if(currentFolder){let f=folders.find(x=>x.id===currentFolder);f?.parent_id?openFolder(f.parent_id):renderHome()}else renderHome()};
db.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user){$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");try{await load()}catch(e){alert(e.message)}}else{$("#app").classList.add("hidden");$("#auth").classList.remove("hidden")}});
let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");await load()}else renderHome();
</script></body></html>
