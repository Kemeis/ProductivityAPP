/* v4: reliable independent scrolling for long task lists and notes */
html,body{height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0}
.main{min-height:0;min-width:0;overflow:hidden;flex:1}
.topbar{flex:0 0 62px;min-height:0}
.content{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;overflow-x:hidden;margin:0 auto;scrollbar-gutter:stable;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:65px}
.list-view,.note-card,.section{min-width:0}

.settings-list summary{cursor:pointer;padding:11px 12px;font-weight:600}

/* Section heading in a task list */
.task-section-heading{position:relative;margin-top:16px;padding:17px 7px 8px;border-radius:0;border-top:1px solid var(--border);background:transparent;grid-template-columns:22px minmax(0,1fr) auto auto}

.welcome{padding:0 0 15px}

.task{grid-template-columns:19px 22px minmax(0,1fr) auto auto!important}

 return ordered.slice(0,limit).map((t,i)=>{

let draggingTaskId=null;
function bindTaskDnD(){
 document.querySelectorAll(".task[data-task-id]").forEach(row=>{
  const handle=row.querySelector(".task-drag");if(!handle)return;
  row.draggable=true;
  row.addEventListener("dragstart",e=>{
   if(e.target.closest("input,select,.task-more,.item-menu") && !e.target.closest(".task-drag")){e.preventDefault();return;}
   draggingTaskId=row.dataset.taskId;
   e.dataTransfer.effectAllowed="move";
   e.dataTransfer.setData("text/plain",draggingTaskId);
   row.classList.add("dragging");e.stopPropagation();
  });
  row.addEventListener("dragend",()=>{draggingTaskId=null;clearTaskDrag();});
  row.addEventListener("dragover",e=>{
   if(!draggingTaskId||draggingTaskId===row.dataset.taskId)return;
   const source=document.querySelector(`.task[data-task-id="${draggingTaskId}"]`);
   if(!source||source.dataset.taskList!==row.dataset.taskList)return;
   e.preventDefault();e.stopPropagation();clearTaskDrag();
   row.classList.add(e.clientY<row.getBoundingClientRect().top+row.offsetHeight/2?"drop-before":"drop-after");
  });
  row.addEventListener("drop",async e=>{
   if(!draggingTaskId||draggingTaskId===row.dataset.taskId)return;
   const source=tasks.find(t=>t.id===draggingTaskId),target=tasks.find(t=>t.id===row.dataset.taskId);
   if(!source||!target||source.list_id!==target.list_id)return;
   e.preventDefault();e.stopPropagation();
   const after=e.clientY>=row.getBoundingClientRect().top+row.offsetHeight/2;
   const moved=draggingTaskId;draggingTaskId=null;clearTaskDrag();
   await reorderListTasks(source.list_id,moved,target.id,after);
  });
 });
}
function clearTaskDrag(){document.querySelectorAll(".task.dragging,.task.drop-before,.task.drop-after").forEach(x=>x.classList.remove("dragging","drop-before","drop-after"));}
async function reorderListTasks(listId,movedId,targetId,after){
 const order=tasks.filter(t=>t.list_id===listId).sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0)||String(a.created_at||"").localeCompare(String(b.created_at||"")));
 const movingIndex=order.findIndex(t=>t.id===movedId);if(movingIndex<0)return;
 const [moving]=order.splice(movingIndex,1);
 const at=order.findIndex(t=>t.id===targetId);if(at<0)return;
 order.splice(at+(after?1:0),0,moving);
 try{
  // Save ordered positions for every item in this list.
  for(let i=0;i<order.length;i++){const r=await db.from("tasks").update({sort_order:i+1}).eq("id",order[i].id).eq("user_id",user.id);if(r.error)throw r.error;}
  await refreshView();
 }catch(e){alert("Could not save task order: "+(e.message||e));await refreshView();}
}

async function addTask(id){
 const i=document.querySelector(`[data-add="${id}"]`),title=i?.value.trim();if(!title)return;
 const selection=document.querySelector(`[data-priority="${id}"]`)?.value||"10";
 const isSection=selection==="section",reward=isSection?0:Number(selection);
 if(!isSection&&![5,10,20,50].includes(reward))return alert("Invalid task priority.");
 const btn=document.querySelector(`[data-addbtn="${id}"]`);i.disabled=true;if(btn)btn.disabled=true;
 try{
  const r=await db.from("tasks").insert({user_id:user.id,list_id:id,title:isSection?SECTION_PREFIX+title:title,coin_reward:reward,is_done:false,sort_order:nextSortOrder(tasks.filter(t=>t.list_id===id))});
  if(r.error)throw r.error;
  await refreshView();
  const nextInput=document.querySelector(`[data-add="${id}"]`);
  const nextSelect=document.querySelector(`[data-priority="${id}"]`);
  if(nextSelect)nextSelect.value=selection;
  if(nextInput){nextInput.focus({preventScroll:true});nextInput.value="";}
 }catch(e){alert(e.message||"Could not add task.");i.disabled=false;if(btn)btn.disabled=false}
}

 // Match exact titles, including case and punctuation. Sections excluded.
 const same=tasks.filter(x=>!isTaskSection(x)&&x.title===t.title);
 const affected=done?same.filter(x=>!x.is_done):same.filter(x=>x.is_done);
 const award=Math.max(...same.map(x=>Number(x.coin_reward)||0),0);
 const delta=done?award:-award;
 try{
  // Read balance immediately before updating; both pages share this profile balance.
  const pr=await db.from("profiles").select("coins").eq("id",user.id).single();
  if(pr.error)throw pr.error;

  const fail=results.find(x=>x.error);if(fail?.error)throw fail.error;
  const balance=Math.max(0,Number(pr.data.coins||0)+delta);
  const cr=await db.from("profiles").update({coins:balance}).eq("id",user.id).select("coins");
  if(cr.error||!cr.data?.length)throw cr.error||Error("Could not update coins");
  await refreshView();
 }catch(e){alert(e.message||"Could not update tasks.");await refreshView();}
 finally{taskToggleBusy=false;}

function closeMenus(){document.querySelectorAll(".item-menu.open,.tree-menu.open,.new-dropdown.open").forEach(m=>m.classList.remove("open"));const btn=$("#newMenuBtn");if(btn)btn.setAttribute("aria-expanded","false")}
document.addEventListener("click",e=>{
  const newBtn=e.target.closest("#newMenuBtn");
  if(newBtn){
    e.stopPropagation();
    const menu=$("#newMenu");
    const already=menu?.classList.contains("open");
    closeMenus();
    if(menu&&!already){menu.classList.add("open");newBtn.setAttribute("aria-expanded","true");}
    return;
  }
  if(e.target.closest("#newMenu"))return;
  const mb=e.target.closest("[data-menu-btn]");
  if(mb){
    e.stopPropagation();const m=document.querySelector(`[data-menu="${mb.dataset.menuBtn}"]`);const already=m?.classList.contains("open");closeMenus();
    if(m&&!already){
      m.style.left="0px";m.style.top="0px";m.style.right="auto";m.style.bottom="auto";
      m.classList.add("open");
      const r=mb.getBoundingClientRect(),box=m.getBoundingClientRect(),gap=6,pad=8;
      const left=Math.max(pad,Math.min(r.right-box.width,innerWidth-box.width-pad));
      const below=r.bottom+gap,above=r.top-box.height-gap;
      const top=below+box.height<=innerHeight-pad?below:(above>=pad?above:Math.max(pad,innerHeight-box.height-pad));
      m.style.left=left+"px";m.style.top=top+"px";
    }
    return;
  }
  const act=e.target.closest(".item-menu button");
  if(act){
    e.stopPropagation();
    const m=act.closest(".item-menu"), key=m.dataset.menu.split(":");
    closeMenus(); handleItemAction(key[0],key[1],act.dataset.action); return;
  }
  if(!e.target.closest(".item-menu,.tree-menu,.tree-more"))closeMenus();
});

async function handleItemAction(type,id,action){
  if(type==="task"){
    if(action==="edit")return editTask(id);
    if(action==="delete")return deleteTask(id);
    return;
  }
  if(action==="open"){type==="folder"?openFolder(id):type==="note"?openNote(id):openList(id);return}
  if(action==="rename"){closeMobileNav();
    let item=type==="folder"?folders.find(x=>x.id===id):type==="note"?notes.find(x=>x.id===id):lists.find(x=>x.id===id);
    modal("Rename",async name=>{
      if(!name)return;
      let table=type==="folder"?"folders":type==="note"?"notes":"task_lists";
      let patch=type==="note"?{title:name}:{name};
      if(type==="note")patch.updated_at=new Date().toISOString();
      let r=await db.from(table).update(patch).eq("id",id).eq("user_id",user.id);
      if(r.error)alert(r.error.message);else{closeModal();await refreshView(); type==="folder"?openFolder(id):type==="note"?openNote(id):openList(id)}
    },item?.name||item?.title||"");return;
  }
  if(action==="color"){closeMobileNav();chooseColor(type,id);return}
  if(action==="delete"){
    if(!confirm(`Delete this ${type}?`))return;
    let table=type==="folder"?"folders":type==="note"?"notes":"task_lists";
    let r=await db.from(table).delete().eq("id",id).eq("user_id",user.id);
    if(r.error)alert(r.error.message);else await refreshView();
    return;
  }
  if(action==="move"){closeMobileNav();moveItemMobile(type,id);return}
}

 const prevFolder=currentFolder,prevDoc=currentDoc&&{...currentDoc};
 await load();
 if(prevDoc?.type==="list"&&lists.some(x=>x.id===prevDoc.id))openListSingle(prevDoc.id);
 else if(prevDoc?.type==="note"&&notes.some(x=>x.id===prevDoc.id))openNoteSingle(prevDoc.id);
 else if(prevFolder&&folders.some(x=>x.id===prevFolder))openFolderSingle(prevFolder);
 if(content)content.scrollTop=previousScroll;
}

function moveItemMobile(type,id){
 const item=type==="folder"?folders.find(x=>x.id===id):type==="note"?notes.find(x=>x.id===id):lists.find(x=>x.id===id);
 const current=type==="folder"?item?.parent_id:item?.folder_id;
 const destinations=folders.filter(f=>f.id!==id&&!(type==="folder"&&path(f.id).some(x=>x.id===id))&&(type!=="folder"||depth(f.id)<5));
 resetModal();$("#modalTitle").textContent="Move to folder";$("#modalInput").classList.add("hidden");$("#modalOk").classList.add("hidden");
 $("#modalBody").innerHTML=`<div class="move-choices"><button data-destination="">⌂ My workspace ${!current?"✓":""}</button>${destinations.map(f=>`<button data-destination="${esc(f.id)}">${"　".repeat(Math.min(depth(f.id),5))}▱ ${esc(f.name)} ${current===f.id?"✓":""}</button>`).join("")}</div>`;
 $("#modalBack").classList.remove("hidden");
 $("#modalBody").querySelectorAll("[data-destination]").forEach(b=>b.onclick=async()=>{
  const destination=b.dataset.destination||null;
  const table=type==="folder"?"folders":type==="note"?"notes":"task_lists";
  const patch=type==="folder"?{parent_id:destination}:{folder_id:destination};
  b.disabled=true;const r=await db.from(table).update(patch).eq("id",id).eq("user_id",user.id);
  if(r.error){b.disabled=false;alert(r.error.message);return}
  closeModal();if(destination)expandedFolders.add(destination);await refreshView();
 });
}

function showFeedback(){
 resetModal();$("#modalTitle").textContent="Feedback / report error";$("#modalInput").classList.add("hidden");$("#modalOk").classList.add("hidden");
 $("#modalBody").innerHTML=`<form class="feedback-form" id="feedbackForm">
 <div><label>Type</label><div class="feedback-choice"><label><input type="radio" name="type" value="bug" checked> Feedback</label><label><input type="radio" name="type" value="error"> Report error</label></div></div>
 <div><label>How does the current version feel?</label><div class="feedback-choice">${[["very_negative","Very negative"],["negative","Negative"],["okay","OK"],["positive","Positive"],["very_positive","Very positive"]].map(([v,label])=>`<label><input type="radio" name="rating" value="${v}" ${v==="okay"?"checked":""}> ${label}</label>`).join("")}</div></div>
 <div><label for="feedbackComment">Comment</label><textarea id="feedbackComment" maxlength="2000" required placeholder="Describe an issue or share an idea…"></textarea></div>
 <div><label for="feedbackEmail">Email (optional)</label><input id="feedbackEmail" type="email" maxlength="254" placeholder="you@example.com"></div>
 <button type="submit" class="primary" id="feedbackSubmit">Send feedback</button></form>`;
 $("#modalBack").classList.remove("hidden");
 $("#feedbackForm").onsubmit=async e=>{
  e.preventDefault();const button=$("#feedbackSubmit");button.disabled=true;
  try{
   const f=$("#feedbackForm"),type=f.querySelector('input[name="type"]:checked').value,rating=f.querySelector('input[name="rating"]:checked').value;
   const comment=$("#feedbackComment").value.trim(),email=$("#feedbackEmail").value.trim();
   if(!comment)throw Error("Please write a comment.");
   const {error}=await db.from("feedback_reports").insert({user_id:user.id,report_type:type,rating,comment,feedback_email:email||null});
   if(error)throw error;
   closeModal();alert("Feedback sent. Thank you!");
  }catch(error){alert("Feedback could not be sent: "+(error.message||error)+". The feedback_reports table may need to be configured.")}
  finally{if(button.isConnected)button.disabled=false}
 };
}
async function resetAllProgress(){
 // Never remove the authentication account here. Deleting dependent records first avoids foreign key errors.
 const button=$("#settingsReset");if(button)button.disabled=true;
 try{
  const uid=user.id;
  for(const table of ["map_tiles","habit_logs","tasks","notes","task_lists","folders","goals","habits"]){
   const {error}=await db.from(table).delete().eq("user_id",uid);
   if(error)throw new Error(table+": "+error.message);
  }
  const {error}=await db.from("profiles").update({coins:0,farm_name:"My Garden"}).eq("id",uid);
  if(error)throw error;
  closeModal();currentFolder=null;currentDoc=null;expandedFolders.clear();await load();
  alert("Progress reset.");
 }catch(error){alert("Reset was not completed: "+(error.message||error)+". Some changes may already have been made.")}
 finally{if(button?.isConnected)button.disabled=false}
}
async function deleteGardenAccount(){
 const button=$("#settingsDelete");if(button)button.disabled=true;
 try{
  const {error}=await db.functions.invoke("delete-account");
  if(error)throw error;
  closeModal();await db.auth.signOut();alert("Account deleted.");
 }catch(error){alert("Account deletion failed. The delete-account Supabase Edge Function must be deployed and configured. "+(error.message||""))}
 finally{if(button?.isConnected)button.disabled=false}
}
